name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Make ghosts white
        run: |
          python -m pip install pillow

          python <<'PY'
          import base64
          import io
          import re
          from pathlib import Path
          from PIL import Image

          files = list(Path("dist").glob("pacman-contribution-graph*.svg"))

          if not files:
              raise RuntimeError("No Pac-Man SVG files found in dist")

          ghost_names = ("blinky", "inky", "pinky", "clyde")
          total_updated = 0

          symbol_pattern = re.compile(
              r'<symbol id="ghost-('
              + "|".join(ghost_names)
              + r')-[^"]+"[\s\S]*?</symbol>'
          )

          image_pattern = re.compile(
              r'data:image/png;base64,([^"]+)'
          )

          def process_symbol(symbol_match):
              global total_updated

              symbol = symbol_match.group(0)

              def process_image(image_match):
                  global total_updated

                  encoded = image_match.group(1)
                  raw = base64.b64decode(encoded)

                  image = Image.open(io.BytesIO(raw)).convert("RGBA")
                  pixels = image.load()

                  changed_pixels = 0

                  for y in range(image.height):
                      for x in range(image.width):
                          r, g, b, a = pixels[x, y]

                          if a == 0:
                              continue

                          maximum = max(r, g, b)
                          minimum = min(r, g, b)
                          saturation = maximum - minimum

                          # צובע רק פיקסלים צבעוניים של גוף הרוח.
                          # שחור, אפור ולבן של העיניים נשארים ללא שינוי.
                          if saturation >= 15 and maximum >= 45:
                              pixels[x, y] = (255, 255, 255, a)
                              changed_pixels += 1

                  if changed_pixels == 0:
                      return image_match.group(0)

                  output = io.BytesIO()
                  image.save(output, format="PNG")

                  new_encoded = base64.b64encode(
                      output.getvalue()
                  ).decode("ascii")

                  total_updated += 1

                  return "data:image/png;base64," + new_encoded

              return image_pattern.sub(process_image, symbol)

          for file in files:
              content = file.read_text(encoding="utf-8")
              updated_content = symbol_pattern.sub(process_symbol, content)
              file.write_text(updated_content, encoding="utf-8")

              print(f"Processed: {file}")

          print(f"Updated ghost images: {total_updated}")

          if total_updated == 0:
              raise RuntimeError("Ghost images were found, but none were changed")
          PY

      - name: Push generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
