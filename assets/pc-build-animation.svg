<svg xmlns="http://www.w3.org/2000/svg"
     width="1100"
     height="520"
     viewBox="0 0 1100 520"
     role="img"
     aria-label="Animated realistic custom PC assembly with liquid cooling">

  <defs>
    <linearGradient id="bg">
    <stop offset="0%" stop-color="#161b22"/>
    <stop offset="100%" stop-color="#161b22"/>
   </linearGradient>

    <linearGradient id="caseMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1b1b"/>
      <stop offset="50%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>

    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#666666"/>
      <stop offset="45%" stop-color="#eeeeee"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </linearGradient>

    <linearGradient id="gpuBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1b1b"/>
      <stop offset="55%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#080b0f"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7"
                    flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="gpuBlade"
          d="M0,-18
             C8,-19 15,-13 15,-6
             C15,0 10,4 3,5
             C6,-3 6,-11 0,-18Z"/>
  </defs>

  <!-- Background -->
  <rect width="1100" height="520" rx="24" fill="url(#bg)"/>

  <!-- Hacker grid -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.035">
    <path d="M0 40H1100 M0 80H1100 M0 120H1100 M0 160H1100
             M0 200H1100 M0 240H1100 M0 280H1100 M0 320H1100
             M0 360H1100 M0 400H1100 M0 440H1100 M0 480H1100"/>
    <path d="M40 0V520 M80 0V520 M120 0V520 M160 0V520
             M200 0V520 M240 0V520 M280 0V520 M320 0V520
             M360 0V520 M400 0V520 M440 0V520 M480 0V520
             M520 0V520 M560 0V520 M600 0V520 M640 0V520
             M680 0V520 M720 0V520 M760 0V520 M800 0V520
             M840 0V520 M880 0V520 M920 0V520 M960 0V520
             M1000 0V520 M1040 0V520 M1080 0V520"/>
  </g>

  <!-- Header -->
  <g font-family="Courier New, monospace">
    <text x="44" y="42" fill="#ffffff" font-size="16" letter-spacing="2">
      MALULI // CUSTOM PC ASSEMBLY
    </text>
    <text x="1056" y="42" text-anchor="end"
          fill="#a3a3a3" font-size="13">
      HARDWARE_SEQUENCE.EXE
    </text>
    <line x1="44" y1="58" x2="1056" y2="58" stroke="#1b1b1b"/>
  </g>

  <ellipse cx="550" cy="447" rx="300" ry="28"
           fill="#000000" opacity="0.65"/>

  <!-- Case -->
  <g filter="url(#shadow)">
    <path d="M345 88 L382 68 H790 L825 88 V427 L790 449 H345Z"
          fill="#07090c" stroke="#4a4a4a" stroke-width="2"/>

    <rect x="295" y="87" width="500" height="360" rx="12"
          fill="url(#caseMetal)" stroke="#a3a3a3" stroke-width="2.5"/>

    <rect x="315" y="98" width="445" height="325" rx="8"
          fill="#080808" stroke="#1b1b1b" stroke-width="1.5"/>

    <path d="M760 88 H795 V447 H760Z"
          fill="#111111" stroke="#4a4a4a"/>

    <path d="M316 360 H760 V423 H316Z"
          fill="#111111" stroke="#1b1b1b"/>

    <rect x="330" y="447" width="62" height="9" rx="3" fill="#1b1b1b"/>
    <rect x="702" y="447" width="62" height="9" rx="3" fill="#1b1b1b"/>
  </g>

  <!-- Motherboard -->
  <g opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1"
             keyTimes="0;0.06;0.14;1"
             dur="12s" repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="translate"
                      values="-470 0;-470 0;0 0;0 0"
                      keyTimes="0;0.06;0.14;1"
                      dur="12s" repeatCount="indefinite"/>

    <rect x="395" y="122" width="260" height="225" rx="5"
          fill="#1a1a1a" stroke="#d8d8d8" stroke-width="2"/>

    <g fill="#080808" stroke="#a3a3a3">
      <circle cx="408" cy="135" r="4"/>
      <circle cx="642" cy="135" r="4"/>
      <circle cx="408" cy="332" r="4"/>
      <circle cx="642" cy="332" r="4"/>
    </g>

    <!-- Rear IO -->
    <rect x="385" y="140" width="18" height="90" rx="2" fill="#7a7a7a"/>
    <g fill="#101010">
      <rect x="388" y="147" width="12" height="9"/>
      <rect x="388" y="161" width="12" height="13"/>
      <rect x="388" y="179" width="12" height="9"/>
      <rect x="388" y="193" width="12" height="14"/>
      <rect x="388" y="212" width="12" height="10"/>
    </g>

    <!-- VRM heatsinks -->
    <path d="M415 138 H505 V165 H415Z"
          fill="#4a4a4a" stroke="#a3a3a3"/>
    <path d="M415 170 H442 V244 H415Z"
          fill="#4a4a4a" stroke="#a3a3a3"/>

    <g stroke="#a3a3a3" opacity="0.55">
      <line x1="425" y1="143" x2="425" y2="160"/>
      <line x1="438" y1="143" x2="438" y2="160"/>
      <line x1="451" y1="143" x2="451" y2="160"/>
      <line x1="464" y1="143" x2="464" y2="160"/>
      <line x1="477" y1="143" x2="477" y2="160"/>
      <line x1="490" y1="143" x2="490" y2="160"/>
    </g>

    <!-- CPU socket -->
    <rect x="462" y="181" width="74" height="74" rx="3"
          fill="#111111" stroke="#a3a3a3" stroke-width="2"/>
    <rect x="470" y="189" width="58" height="58"
          fill="#242424" stroke="#666666"/>

    <!-- RAM slots -->
    <g fill="#080808" stroke="#7a7a7a">
      <rect x="554" y="161" width="11" height="119" rx="2"/>
      <rect x="572" y="161" width="11" height="119" rx="2"/>
      <rect x="590" y="161" width="11" height="119" rx="2"/>
      <rect x="608" y="161" width="11" height="119" rx="2"/>
    </g>

    <!-- Chipset -->
    <path d="M567 291 H631 V335 H567Z"
          fill="#4a4a4a" stroke="#a3a3a3"/>
    <path d="M575 299 L622 326 M575 326 L622 299"
          stroke="#a3a3a3" opacity="0.6"/>

    <!-- M.2 -->
    <rect x="443" y="274" width="112" height="17" rx="3"
          fill="#666666" stroke="#a3a3a3"/>

    <!-- PCIe slots -->
    <rect x="426" y="300" width="130" height="10" rx="2"
          fill="#080808" stroke="#d8d8d8"/>
    <rect x="426" y="319" width="105" height="8" rx="2"
          fill="#080808" stroke="#7a7a7a"/>

    <g stroke="#a3a3a3" stroke-width="1"
       fill="none" opacity="0.3">
      <path d="M442 170 H454 V181"/>
      <path d="M536 190 H550"/>
      <path d="M536 230 H550"/>
      <path d="M619 280 V290"/>
      <path d="M555 309 H565"/>
      <path d="M415 260 H440 V274"/>
    </g>
  </g>

  <!-- CPU -->
  <g opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1"
             keyTimes="0;0.17;0.23;1"
             dur="12s" repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="translate"
                      values="0 -280;0 -280;0 0;0 0"
                      keyTimes="0;0.17;0.23;1"
                      dur="12s" repeatCount="indefinite"/>

    <rect x="473" y="192" width="52" height="52" rx="3"
          fill="#1b1b1b" stroke="#a3a3a3"/>

    <path d="M479 197 H519 V239 H479Z"
          fill="url(#steel)" stroke="#ffffff" stroke-width="1.5"/>

    <g stroke="#ffffff" opacity="0.4">
      <line x1="483" y1="203" x2="515" y2="203"/>
      <line x1="483" y1="233" x2="515" y2="233"/>
    </g>
  </g>

  <!-- RAM -->
  <g opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1"
             keyTimes="0;0.27;0.34;1"
             dur="12s" repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="translate"
                      values="0 -300;0 -300;0 0;0 0"
                      keyTimes="0;0.27;0.34;1"
                      dur="12s" repeatCount="indefinite"/>

    <g>
      <rect x="570" y="166" width="14" height="110" rx="2"
            fill="#111111" stroke="#eeeeee" stroke-width="1.5"/>
      <g fill="#4a4a4a">
        <rect x="573" y="181" width="8" height="13"/>
        <rect x="573" y="199" width="8" height="13"/>
        <rect x="573" y="217" width="8" height="13"/>
        <rect x="573" y="235" width="8" height="13"/>
        <rect x="573" y="253" width="8" height="13"/>
      </g>
    </g>

    <g>
      <rect x="606" y="166" width="14" height="110" rx="2"
            fill="#111111" stroke="#eeeeee" stroke-width="1.5"/>
      <g fill="#4a4a4a">
        <rect x="609" y="181" width="8" height="13"/>
        <rect x="609" y="199" width="8" height="13"/>
        <rect x="609" y="217" width="8" height="13"/>
        <rect x="609" y="235" width="8" height="13"/>
        <rect x="609" y="253" width="8" height="13"/>
      </g>
    </g>
  </g>

  <!-- Water cooling -->
  <g opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1"
             keyTimes="0;0.38;0.47;1"
             dur="12s" repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="translate"
                      values="0 -240;0 -240;0 0;0 0"
                      keyTimes="0;0.38;0.47;1"
                      dur="12s" repeatCount="indefinite"/>

    <!-- Pump block -->
    <rect x="465" y="185" width="68" height="68" rx="12"
          fill="#111111" stroke="#eeeeee" stroke-width="2"/>

    <rect x="474" y="194" width="50" height="50" rx="9"
          fill="#242424" stroke="#7a7a7a"/>

    <circle cx="499" cy="219" r="13"
            fill="#0d1117" stroke="#d8d8d8" stroke-width="1.5"/>

    <!-- Tubes -->
    <path d="M525 203 C570 145 638 122 710 138"
          fill="none" stroke="#4a4a4a"
          stroke-width="9" stroke-linecap="round"/>

    <path d="M526 236 C585 255 651 230 710 190"
          fill="none" stroke="#1b1b1b"
          stroke-width="9" stroke-linecap="round"/>

    <!-- Radiator -->
    <rect x="705" y="120" width="38" height="205" rx="4"
          fill="#111111" stroke="#a3a3a3" stroke-width="1.5"/>

    <g stroke="#4a4a4a">
      <line x1="712" y1="128" x2="712" y2="317"/>
      <line x1="719" y1="128" x2="719" y2="317"/>
      <line x1="726" y1="128" x2="726" y2="317"/>
      <line x1="733" y1="128" x2="733" y2="317"/>
    </g>
  </g>

  <!-- PSU on the left -->
  <g opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1"
             keyTimes="0;0.51;0.58;1"
             dur="12s" repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="translate"
                      values="-250 0;-250 0;0 0;0 0"
                      keyTimes="0;0.51;0.58;1"
                      dur="12s" repeatCount="indefinite"/>

    <rect x="330" y="367" width="170" height="49" rx="4"
          fill="#111111" stroke="#a3a3a3" stroke-width="1.5"/>

    <circle cx="370" cy="391" r="20"
            fill="#080808" stroke="#666666"/>

    <g stroke="#666666">
      <line x1="356" y1="377" x2="384" y2="405"/>
      <line x1="384" y1="377" x2="356" y2="405"/>
      <line x1="351" y1="391" x2="389" y2="391"/>
      <line x1="370" y1="372" x2="370" y2="410"/>
    </g>

    <g fill="#1b1b1b" stroke="#7a7a7a">
      <rect x="452" y="374" width="35" height="9" rx="2"/>
      <rect x="452" y="387" width="35" height="9" rx="2"/>
      <rect x="452" y="400" width="35" height="9" rx="2"/>
    </g>
  </g>

  <!-- GPU -->
  <g opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1"
             keyTimes="0;0.62;0.70;1"
             dur="12s"
             repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="translate"
                      values="520 0;520 0;0 0;0 0"
                      keyTimes="0;0.62;0.70;1"
                      dur="12s"
                      repeatCount="indefinite"/>

    <!-- Rear expansion bracket -->
    <path d="M380 274 H397 V348 H380Z"
          fill="#a3a3a3"
          stroke="#d8d8d8"/>

    <g fill="#111111">
      <rect x="383" y="282" width="11" height="18"/>
      <rect x="383" y="306" width="11" height="12"/>
      <rect x="383" y="323" width="11" height="12"/>
    </g>

    <!-- Visible backplate -->
    <path d="M397 266 H666 L684 277 H407Z"
          fill="#4a4a4a"
          stroke="#a3a3a3"/>

    <!-- GPU body -->
    <path d="M397 274
             H674
             L690 286
             V329
             H397Z"
          fill="url(#gpuBody)"
          stroke="#eeeeee"
          stroke-width="2"/>

    <!-- Side heatsink fins -->
    <g stroke="#666666" stroke-width="1" opacity="0.85">
      <line x1="412" y1="282" x2="412" y2="326"/>
      <line x1="423" y1="282" x2="423" y2="326"/>
      <line x1="434" y1="282" x2="434" y2="326"/>
      <line x1="445" y1="282" x2="445" y2="326"/>
      <line x1="456" y1="282" x2="456" y2="326"/>
      <line x1="467" y1="282" x2="467" y2="326"/>
      <line x1="478" y1="282" x2="478" y2="326"/>
      <line x1="489" y1="282" x2="489" y2="326"/>
      <line x1="500" y1="282" x2="500" y2="326"/>
      <line x1="511" y1="282" x2="511" y2="326"/>
      <line x1="522" y1="282" x2="522" y2="326"/>
      <line x1="533" y1="282" x2="533" y2="326"/>
      <line x1="544" y1="282" x2="544" y2="326"/>
      <line x1="555" y1="282" x2="555" y2="326"/>
      <line x1="566" y1="282" x2="566" y2="326"/>
      <line x1="577" y1="282" x2="577" y2="326"/>
      <line x1="588" y1="282" x2="588" y2="326"/>
      <line x1="599" y1="282" x2="599" y2="326"/>
      <line x1="610" y1="282" x2="610" y2="326"/>
      <line x1="621" y1="282" x2="621" y2="326"/>
      <line x1="632" y1="282" x2="632" y2="326"/>
      <line x1="643" y1="282" x2="643" y2="326"/>
      <line x1="654" y1="282" x2="654" y2="326"/>
      <line x1="665" y1="282" x2="665" y2="326"/>
    </g>

    <!-- Neutral PCIe connector -->
    <path d="M430 329 H530 V336 H490 L483 341 H430Z"
          fill="#cfcfcf"/>

    <!-- Fan tray on the underside -->
    <path d="M408 329 H676 V359 H408Z"
          fill="#080808"
          stroke="#7a7a7a"
          stroke-width="1.5"/>

    <!-- Static underside fan 1 -->
    <g transform="translate(454 345)">
      <ellipse rx="33" ry="12"
               fill="#080808"
               stroke="#a3a3a3"
               stroke-width="1.5"/>
      <ellipse rx="26" ry="9"
               fill="none"
               stroke="#666666"/>
      <g fill="#4a4a4a">
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z"/>
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z" transform="rotate(60)"/>
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z" transform="rotate(120)"/>
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z" transform="rotate(180)"/>
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z" transform="rotate(240)"/>
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z" transform="rotate(300)"/>
      </g>
      <ellipse rx="7" ry="3" fill="#d8d8d8"/>
    </g>

    <!-- Static underside fan 2 -->
    <g transform="translate(540 345)">
      <ellipse rx="33" ry="12"
               fill="#080808"
               stroke="#a3a3a3"
               stroke-width="1.5"/>
      <ellipse rx="26" ry="9"
               fill="none"
               stroke="#666666"/>
      <g fill="#4a4a4a">
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z"/>
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z" transform="rotate(60)"/>
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z" transform="rotate(120)"/>
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z" transform="rotate(180)"/>
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z" transform="rotate(240)"/>
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z" transform="rotate(300)"/>
      </g>
      <ellipse rx="7" ry="3" fill="#d8d8d8"/>
    </g>

    <!-- Static underside fan 3 -->
    <g transform="translate(626 345)">
      <ellipse rx="33" ry="12"
               fill="#080808"
               stroke="#a3a3a3"
               stroke-width="1.5"/>
      <ellipse rx="26" ry="9"
               fill="none"
               stroke="#666666"/>
      <g fill="#4a4a4a">
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z"/>
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z" transform="rotate(60)"/>
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z" transform="rotate(120)"/>
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z" transform="rotate(180)"/>
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z" transform="rotate(240)"/>
        <path d="M0,-8 C8,-8 16,-5 20,0 C15,2 8,3 0,2Z" transform="rotate(300)"/>
      </g>
      <ellipse rx="7" ry="3" fill="#d8d8d8"/>
    </g>

    <!-- Empty GPU power socket, without cable -->
    <rect x="637" y="263" width="31" height="10" rx="2"
          fill="#111111"
          stroke="#a3a3a3"/>
  </g>

  <!-- Glass panel -->
  <g opacity="0">
    <animate attributeName="opacity"
             values="0;0;0.82;0.82"
             keyTimes="0;0.82;0.89;1"
             dur="12s" repeatCount="indefinite"/>

    <rect x="323" y="102" width="435" height="318" rx="8"
          fill="url(#glass)" stroke="#a3a3a3" stroke-width="1.5"/>

    <path d="M337 111 L470 111 L337 245Z"
          fill="#ffffff" opacity="0.035"/>

    <g fill="#d8d8d8">
      <circle cx="337" cy="116" r="3"/>
      <circle cx="744" cy="116" r="3"/>
      <circle cx="337" cy="406" r="3"/>
      <circle cx="744" cy="406" r="3"/>
    </g>
  </g>

  <!-- Power button -->
  <g>
    <circle cx="776" cy="110" r="9"
            fill="#080808" stroke="#a3a3a3" stroke-width="1.5"/>

    <path d="M776 104 V110 M771 106 A7 7 0 1 0 781 106"
          fill="none" stroke="#eeeeee"
          stroke-width="1.5" stroke-linecap="round"/>

    <circle cx="776" cy="110" r="15"
            fill="none" stroke="#ffffff"
            stroke-width="2" opacity="0"
            filter="url(#glow)">
      <animate attributeName="opacity"
               values="0;0;1;0.25;0.8"
               keyTimes="0;0.82;0.87;0.92;1"
               dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Interior light -->
  <rect x="320" y="99" width="443" height="326" rx="9"
        fill="none" stroke="#ffffff" stroke-width="2"
        opacity="0" filter="url(#glow)">
    <animate attributeName="opacity"
             values="0;0;0.45;0.12;0.28"
             keyTimes="0;0.84;0.89;0.94;1"
             dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- Status -->
  <g font-family="Courier New, monospace">
    <text x="44" y="488" fill="#7a7a7a" font-size="13">
      STATUS:
    </text>

    <text x="108" y="488" fill="#a3a3a3" font-size="13">
      INSTALLING HARDWARE COMPONENTS
      <animate attributeName="opacity"
               values="1;1;0;0"
               keyTimes="0;0.82;0.86;1"
               dur="12s" repeatCount="indefinite"/>
    </text>

    <text x="108" y="488"
          fill="#ffffff" font-size="13"
          letter-spacing="1.4" opacity="0"
          filter="url(#glow)">
      BUILD COMPLETE // SYSTEM ONLINE
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.85;0.91;1"
               dur="12s" repeatCount="indefinite"/>
    </text>

    <rect x="790" y="477" width="266" height="14" rx="7"
          fill="#111111" stroke="#4a4a4a"/>

    <rect x="793" y="480" width="0" height="8" rx="4"
          fill="#eeeeee">
      <animate attributeName="width"
               values="0;0;34;65;98;132;170;208;236;260;260"
               keyTimes="0;0.05;0.14;0.23;0.34;0.47;0.58;0.70;0.80;0.87;1"
               dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
