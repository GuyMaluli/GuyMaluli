<svg xmlns="http://www.w3.org/2000/svg"
     width="1100"
     height="560"
     viewBox="0 0 1100 560"
     role="img"
     aria-label="Animated Windows 11 terminal profile for Guy Malul">

  <defs>
    <linearGradient id="windowBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>

    <linearGradient id="titleBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#202020"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12"
                    flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="terminalClip">
      <rect x="70" y="122" width="960" height="360" rx="0"/>
    </clipPath>
  </defs>

  <!-- GitHub dark compatible background -->
  <rect width="1100" height="560" fill="#0d1117"/>

  <!-- Window -->
  <g filter="url(#shadow)">
    <rect x="45" y="45" width="1010" height="470" rx="16"
          fill="url(#windowBg)" stroke="#444444" stroke-width="1.5"/>

    <!-- Windows 11 title bar -->
    <path d="M61 45 H1039
             A16 16 0 0 1 1055 61
             V105 H45 V61
             A16 16 0 0 1 61 45Z"
          fill="url(#titleBar)"/>

    <line x1="45" y1="105" x2="1055" y2="105"
          stroke="#363636" stroke-width="1"/>

    <!-- App icon -->
    <rect x="68" y="66" width="22" height="22" rx="5"
          fill="#0c0c0c" stroke="#8a8a8a"/>

    <text x="79" y="82"
          text-anchor="middle"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="14"
          fill="#f5f5f5">&gt;_</text>

    <!-- Title -->
    <text x="106" y="81"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="14"
          fill="#e8e8e8">
      Windows Terminal
    </text>

    <!-- Tab -->
    <rect x="316" y="58" width="260" height="38" rx="9"
          fill="#111111" stroke="#333333"/>

    <text x="337" y="82"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="13"
          fill="#d8d8d8">
      PowerShell
    </text>

    <text x="550" y="82"
          text-anchor="end"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="18"
          fill="#8d8d8d">
      ×
    </text>

    <text x="596" y="82"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="20"
          fill="#a5a5a5">
      +
    </text>

    <!-- Window buttons -->
    <g fill="none" stroke="#d0d0d0" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round">
      <line x1="931" y1="77" x2="945" y2="77"/>
      <rect x="976" y="70" width="14" height="14"/>
      <line x1="1020" y1="70" x2="1034" y2="84"/>
      <line x1="1034" y1="70" x2="1020" y2="84"/>
    </g>

    <!-- Terminal body -->
    <rect x="45" y="105" width="1010" height="410"
          fill="#0b0b0b"/>
  </g>

  <!-- Terminal content -->
  <g clip-path="url(#terminalClip)"
     font-family="Cascadia Code, Consolas, Courier New, monospace">

    <text x="75" y="142" font-size="14" fill="#bdbdbd">
      Microsoft Windows [Version 11.0.26100]
    </text>

    <text x="75" y="165" font-size="14" fill="#8e8e8e">
      (c) Microsoft Corporation. All rights reserved.
    </text>

    <!-- whoami -->
    <text x="75" y="205" font-size="15" fill="#f2f2f2">
      PS C:\Users\Guy&gt;
    </text>

    <text x="225" y="205" font-size="15" fill="#f2f2f2" opacity="0">
      whoami
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.08;0.12;1"
               dur="10s"
               repeatCount="indefinite"/>
    </text>

    <text x="75" y="238" font-size="18" fill="#ffffff" opacity="0">
      Guy Malul
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.13;0.18;1"
               dur="10s"
               repeatCount="indefinite"/>
    </text>

    <!-- About -->
    <text x="75" y="282" font-size="15" fill="#f2f2f2" opacity="0">
      PS C:\Users\Guy&gt;
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.20;0.24;1"
               dur="10s"
               repeatCount="indefinite"/>
    </text>

    <text x="225" y="282" font-size="15" fill="#f2f2f2" opacity="0">
      about.exe
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.24;0.29;1"
               dur="10s"
               repeatCount="indefinite"/>
    </text>

    <text x="75" y="318" font-size="16" fill="#ffffff" opacity="0">
      Electrical &amp; Electronics Engineering Student
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.31;0.36;1"
               dur="10s"
               repeatCount="indefinite"/>
    </text>

    <text x="75" y="349" font-size="16" fill="#d8d8d8" opacity="0">
      PC Building Enthusiast
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.37;0.42;1"
               dur="10s"
               repeatCount="indefinite"/>
    </text>

    <text x="75" y="380" font-size="16" fill="#d8d8d8" opacity="0">
      Web Developer &amp; Programmer
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.43;0.48;1"
               dur="10s"
               repeatCount="indefinite"/>
    </text>

    <text x="75" y="411" font-size="16" fill="#d8d8d8" opacity="0">
      Exploring Game Development &amp; Gaming
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.49;0.54;1"
               dur="10s"
               repeatCount="indefinite"/>
    </text>

    <!-- Final prompt -->
    <text x="75" y="455" font-size="15" fill="#f2f2f2" opacity="0">
      PS C:\Users\Guy&gt;
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.56;0.61;1"
               dur="10s"
               repeatCount="indefinite"/>
    </text>

    <rect x="225" y="441" width="10" height="18"
          fill="#ffffff" opacity="0">
      <animate attributeName="opacity"
               values="0;0;1;0;1;0;1"
               keyTimes="0;0.60;0.68;0.76;0.84;0.92;1"
               dur="10s"
               repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Contact bar -->
  <line x1="45" y1="515" x2="1055" y2="515"
        stroke="#363636" stroke-width="1"/>

  <rect x="45" y="515" width="1010" height="45"
        fill="#111111"/>

  <line x1="550" y1="515" x2="550" y2="560"
        stroke="#2f2f2f"/>

